<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aspire - offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1311; color: #e8efe9; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 28rem; padding: 24px 16px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  p { margin: 0 0 24px; color: #b5c2ba; }
  button { font: inherit; min-height: 48px; padding: 0 24px; border-radius: 999px; border: 1px solid #5fd0a4; background: transparent; color: #e8efe9; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="t">No connection</h1>
  <p id="b">Aspire needs the internet for live weather, transport and answers. This page reloads by itself when you are back online.</p>
  <button id="r" type="button">Try again</button>
</main>
<script>
  // Static on purpose: no personal data is ever cached. The words follow the browser's language.
  var T = {
    mn: ["Интернэт холболт алга", "Aspire цаг агаар, тээвэр, хариултыг интернэтээр авдаг. Холболт сэргэхэд энэ хуудас өөрөө дахин ачаална.", "Дахин оролдох"],
    zh: ["没有网络连接", "Aspire 需要联网才能提供天气、交通和回答。恢复联网后，此页面会自动重新加载。", "重试"],
    ru: ["Нет подключения", "Aspire нужен интернет для погоды, транспорта и ответов. Страница обновится сама, когда связь вернётся.", "Повторить"],
    de: ["Keine Verbindung", "Aspire braucht das Internet für Wetter, Verkehr und Antworten. Diese Seite lädt sich neu, sobald Sie wieder online sind.", "Erneut versuchen"]
  };
  var l = (navigator.language || "en").slice(0, 2).toLowerCase();
  if (T[l]) {
    document.documentElement.lang = l;
    document.getElementById("t").textContent = T[l][0];
    document.getElementById("b").textContent = T[l][1];
    document.getElementById("r").textContent = T[l][2];
  }
  document.getElementById("r").addEventListener("click", function () { location.reload(); });
  addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
